# Stack do EDGE PROXY — Traefik v3 + docker-socket-proxy.
# Sobe uma vez em /opt/platform/edge. É o único ponto que publica 80/443.
#
# Variáveis lidas de /opt/platform/.env:
#   TRAEFIK_DASHBOARD_HOST   (o ACME_EMAIL é injetado no traefik.yml pela etapa 9)
#
# Subir:  docker compose --env-file /opt/platform/.env up -d
# Validar (local): docker compose -f compose.yml config

services:
  # ── Proxy do socket do Docker ───────────────────────────────────────────────
  # O Traefik precisa LER a lista de containers para descobrir rotas, mas dar a
  # ele o /var/run/docker.sock cru equivale a dar root na máquina. Este proxy
  # expõe SOMENTE a API de containers, em modo leitura.
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # única permissão necessária ao Traefik (read-only)
      NETWORKS: 1     # necessário para resolver a rede 'edge'
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      EXEC: 0
      POST: 0         # nega qualquer escrita na API do Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Traefik ─────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      - socket-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme.json:/acme/acme.json
    networks:
      - edge
      - socket
      - observability
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - traefik.enable=true
      # Router do dashboard: HTTPS + basic-auth + allowlist de IP. Nunca público.
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=le
      - traefik.http.routers.dashboard.service=api@internal
      # dashboard-auth (basic-auth) é gerado pela etapa 9 em dynamic/dashboard-auth.yml.
      - traefik.http.routers.dashboard.middlewares=dashboard-auth@file,admin-allowlist@file

networks:
  # Rede pública compartilhada: Traefik ↔ containers das aplicações.
  edge:
    external: true
  # Rede de observabilidade: Prometheus alcança as métricas do Traefik.
  observability:
    external: true
  # Rede privada Traefik ↔ socket-proxy (não sai daqui).
  socket:
    internal: true
