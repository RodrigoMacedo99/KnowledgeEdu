# Stack de OBSERVABILIDADE — métricas, logs e dashboards.
# Sobe uma vez em /opt/platform/observability.
#
# Variáveis lidas de /opt/platform/.env:
#   GRAFANA_HOST, GF_SECURITY_ADMIN_PASSWORD
#
# Subir:  docker compose --env-file /opt/platform/.env up -d
# Validar (local): docker compose -f compose.yml config
#
# Regra de ouro: NADA aqui é publicado na internet, exceto o Grafana — e mesmo
# ele passa pelo Traefik (HTTPS + login obrigatório). Prometheus, Loki, cAdvisor
# e node-exporter só existem dentro da rede 'observability'.

services:
  # ── Métricas: coleta e armazena séries temporais ────────────────────────────
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
      - edge            # necessário para raspar as métricas do Traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Dashboards: única peça acessível de fora (via Traefik) ───────────────────
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    # Vazio por padrão (login normal do Grafana). A etapa 21 preenche este arquivo
    # com o auth-proxy do Authelia para habilitar login único (SSO) sem 2º login.
    env_file:
      - ./grafana.env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
      - edge
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.routers.grafana.middlewares=secure-chain@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  # ── Logs: armazena e indexa ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Coletor de logs: descobre containers e envia ao Loki ────────────────────
  alloy:
    image: grafana/alloy:v1.5.0
    restart: unless-stopped
    depends_on:
      - loki
      - socket-proxy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Proxy do socket para o Alloy (mesmo padrão do edge: leitura apenas) ──────
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      NODES: 0
      IMAGES: 0
      VOLUMES: 0
      EXEC: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Métricas por container ──────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Métricas do host (a própria VPS) ────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  observability:
    external: true
  edge:
    external: true
