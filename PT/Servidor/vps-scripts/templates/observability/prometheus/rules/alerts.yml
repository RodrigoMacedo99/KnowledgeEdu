# Regras de alerta alinhadas aos SLOs do CLAUDE.md
# (error_rate < 0.1%, p99 < 2s, availability 99.9%) + saúde de host/containers.
# Copiado para: /opt/platform/observability/prometheus/rules/alerts.yml

groups:
  - name: disponibilidade
    rules:
      - alert: AlvoInacessivel
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Alvo {{ $labels.job }} inacessível"
          description: "O Prometheus não consegue raspar {{ $labels.instance }} há 2 min."

      - alert: ContainerReiniciando
        expr: rate(container_last_seen[5m]) == 0 and container_last_seen > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Container sumiu do cAdvisor"
          description: "Um container monitorado parou de reportar métricas."

  - name: slos-traefik
    rules:
      - alert: TaxaDeErroAlta
        # > 0.1% de 5xx por serviço (SLO error_rate < 0.1%)
        expr: |
          sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) by (service)
          / sum(rate(traefik_service_requests_total[5m])) by (service) > 0.001
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Taxa de erro 5xx > 0.1% em {{ $labels.service }}"
          description: "Erros do servidor acima do SLO nos últimos 5 min."

      - alert: LatenciaP99Alta
        # p99 > 2s (SLO p99_latency < 2s)
        expr: |
          histogram_quantile(0.99,
            sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Latência p99 > 2s em {{ $labels.service }}"
          description: "Latência acima do SLO nos últimos 5 min."

  - name: recursos-host
    rules:
      - alert: DiscoQuaseCheio
        expr: |
          (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disco / acima de 85%"
          description: "Espaço em disco baixo no host."

      - alert: MemoriaQuaseCheia
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Memória do host acima de 90%"
          description: "Uso de memória alto no host."
