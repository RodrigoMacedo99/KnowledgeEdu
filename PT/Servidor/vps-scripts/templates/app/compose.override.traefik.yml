# EXEMPLO do compose.override.yml que a ETAPA 15 GERA NO SERVIDOR (não vai pro
# repositório). Ele adiciona, a cada container público do seu serviço, as labels
# do Traefik (domínio + HTTPS) e o conecta à rede 'edge'. O container do banco e
# o worker não aparecem aqui — continuam só na rede interna.
#
# O deploy combina os dois arquivos:
#   docker compose -f compose.yml -f compose.override.yml up -d
#
# Cada '${...}' vem do .env do ambiente. A etapa 15 substitui os nomes dos
# serviços (web/api) e as portas internas pelos que você informar.

services:
  web:
    networks:
      - internal
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.${PROJECT}-web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.${PROJECT}-web.entrypoints=websecure
      - traefik.http.routers.${PROJECT}-web.tls.certresolver=le
      - traefik.http.routers.${PROJECT}-web.middlewares=secure-chain@file
      - traefik.http.services.${PROJECT}-web.loadbalancer.server.port=80

  api:
    networks:
      - internal
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.${PROJECT}-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.${PROJECT}-api.entrypoints=websecure
      - traefik.http.routers.${PROJECT}-api.tls.certresolver=le
      - traefik.http.routers.${PROJECT}-api.middlewares=secure-chain@file
      - traefik.http.services.${PROJECT}-api.loadbalancer.server.port=3000

networks:
  edge:
    external: true
