# Referência de um serviço no k3s — Deployment + Service + IngressRoute.
# Equivalente ao compose.yml + labels do Traefik do modelo Docker. Para gerar os
# manifests de um serviço real use a etapa 29 (ela não aplica nada: você revisa e
# aplica com 'sudo k3s kubectl apply -k <dir>').
#
# Troque: o namespace (um dos previstos), a imagem (tag FIXA, nunca 'latest') e o
# domínio. A imagem de exemplo abaixo NÃO existe: é só a forma do manifest.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exemplo-api
  namespace: sdi            # troque pelo namespace do projeto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exemplo-api
  template:
    metadata:
      labels:
        app: exemplo-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/SEU_USUARIO/exemplo-api:1.0.0   # troque; tag fixa
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:      # o mínimo garantido
              cpu: "50m"
              memory: "64Mi"
            limits:        # o teto que não pode ultrapassar
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

---
apiVersion: v1
kind: Service
metadata:
  name: exemplo-api
  namespace: sdi
spec:
  selector:
    app: exemplo-api
  ports:
    - port: 80
      targetPort: 3000

---
# IngressRoute do Traefik: a regra pública. HTTPS emitido pelo Traefik (ACME,
# resolvedor 'letsencrypt', etapa 25). Para exigir 2FA, acrescente o middleware
# 'authelia' do MESMO namespace (templates/k3s/authelia-middleware.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: exemplo-api
  namespace: sdi
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`api.exemplo.com`)
      services:
        - name: exemplo-api
          port: 80
  tls:
    certResolver: letsencrypt
