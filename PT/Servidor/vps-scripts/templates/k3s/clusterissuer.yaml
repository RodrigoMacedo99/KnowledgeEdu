# NÃO USAR — arquivo mantido só como registro. O cert-manager foi removido do
# toolkit: o HTTPS é emitido pelo próprio Traefik do k3s (ACME), ver traefik-acme.yaml
# e a etapa 25. Nenhum script aplica este arquivo.
#
# (Conteúdo original: ClusterIssuer do cert-manager para Let's Encrypt.)

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: __EMAIL__
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            class: traefik
