# Values do chart kube-prometheus-stack (Prometheus + Grafana + Alertmanager +
# node-exporter + kube-state-metrics) para o k3s. A etapa 26 substitui
# __GRAFANA_HOST__ e acrescenta a seção 'alertmanager' (destinos de alerta).
#
# Nenhum segredo fica aqui:
#   - senha do administrador do Grafana: Secret 'grafana-admin' (existingSecret)
#   - token/URL de alerta: Secret 'alertmanager-secrets', montado no Alertmanager
# O Grafana é exposto por IngressRoute do Traefik (templates/k3s/grafana-ingressroute.yaml),
# por isso o Ingress do próprio chart fica desligado.

grafana:
  ingress:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://__GRAFANA_HOST__
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  # Datasource de logs (caso você instale o Loki na etapa 26).
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
  # O Grafana tenta atualizar plugins embutidos na imagem em segundo plano
  # (falha sempre, pois são read-only — não é erro fatal, só ruído no log).
  # Desligamos para não gastar CPU/memória à toa nesse processo.
  env:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"
  resources:
    requests:
      memory: 256Mi
    limits:
      # 256Mi era insuficiente e causava OOMKilled ao navegar entre dashboards
      # (o Grafana soma o processo principal + backend de busca + plugins).
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

prometheus-node-exporter:
  resources:
    limits:
      memory: 128Mi
