# Authelia no k3s — SSO + 2FA via forward-auth do Traefik (equivalente ao stack
# Docker). A etapa 27 substitui __DOMAIN__ e __AUTH_HOST__ e cria à parte os
# Secrets 'authelia-secrets' (chaves) e 'authelia-users' (base de usuários).
#
# O 2FA de um serviço NÃO é uma anotação: o IngressRoute do serviço referencia o
# Middleware 'authelia' do PRÓPRIO namespace (templates/k3s/authelia-middleware.yaml).
# Este arquivo não contém Middleware.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: operacao
data:
  configuration.yml: |
    theme: 'dark'
    server:
      address: 'tcp4://0.0.0.0:9091/'
    log:
      level: 'info'
      format: 'json'
    totp:
      issuer: '__DOMAIN__'
    authentication_backend:
      password_reset:
        disable: true
      file:
        path: '/config/users_database.yml'
        search:
          email: true
    access_control:
      default_policy: 'two_factor'
    regulation:
      max_retries: 3
      find_time: '2 minutes'
      ban_time: '5 minutes'
    session:
      cookies:
        - domain: '__DOMAIN__'
          authelia_url: 'https://__AUTH_HOST__'
          name: 'authelia_session'
          expiration: '1 hour'
          inactivity: '5 minutes'
    storage:
      local:
        path: '/data/db.sqlite3'
    notifier:
      filesystem:
        filename: '/data/notification.txt'

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: operacao
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: operacao
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      # O Kubernetes injeta env vars por Service (AUTHELIA_PORT, AUTHELIA_SERVICE_*...)
      # e o Authelia lê tudo que começa com AUTHELIA_ como config, causando conflito
      # com server.address. Desligar os service links evita isso.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authelia
          # Versão patch fixada (verificada: 4.38.19). Nunca 'latest'.
          image: authelia/authelia:4.38.19
          ports:
            - containerPort: 9091
          envFrom:
            - secretRef:
                name: authelia-secrets
          readinessProbe:
            httpGet: { path: /api/health, port: 9091 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 9091 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
              readOnly: true
            - name: users
              mountPath: /config/users_database.yml
              subPath: users_database.yml
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits:   { memory: "128Mi" }
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: users
          secret:
            secretName: authelia-users
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data

---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: operacao
spec:
  selector:
    app: authelia
  ports:
    - port: 9091
      targetPort: 9091

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: operacao
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`__AUTH_HOST__`)
      services:
        - name: authelia
          port: 9091
  tls:
    certResolver: letsencrypt
