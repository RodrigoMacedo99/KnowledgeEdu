# Stack do AUTHELIA — SSO + 2FA para os serviços web, via forward-auth do Traefik.
# Sobe em /opt/platform/auth.
#
# Variáveis lidas de /opt/platform/.env:
#   AUTH_HOST, AUTHELIA_SESSION_SECRET, AUTHELIA_STORAGE_ENCRYPTION_KEY,
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
#   AUTHELIA_NOTIFIER_SMTP_PASSWORD (opcional — só se usar SMTP)
#
# Subir:  docker compose --env-file /opt/platform/.env up -d
# Validar (local): docker compose -f compose.yml config
#
# Para proteger QUALQUER serviço com 2FA, basta adicionar ao router dele a label:
#   traefik.http.routers.<seu-router>.middlewares=authelia@docker
# (ou combine com outros: secure-chain@file,authelia@docker)

services:
  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    environment:
      # Segredos injetados pelo .env (o Authelia lê AUTHELIA_* automaticamente).
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
      # Senha do SMTP (vazia se você optou por notificações em arquivo).
      AUTHELIA_NOTIFIER_SMTP_PASSWORD: ${AUTHELIA_NOTIFIER_SMTP_PASSWORD:-}
    volumes:
      - ./configuration.yml:/config/configuration.yml:ro
      - ./users_database.yml:/config/users_database.yml:ro
      - authelia-data:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "authelia", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      # Portal de login do próprio Authelia (público, com HTTPS).
      - traefik.http.routers.authelia.rule=Host(`${AUTH_HOST}`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.routers.authelia.tls.certresolver=le
      - traefik.http.routers.authelia.middlewares=secure-chain@file
      - traefik.http.services.authelia.loadbalancer.server.port=9091
      # Middleware forward-auth que os OUTROS serviços referenciam (authelia@docker):
      - traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email

volumes:
  authelia-data:

networks:
  edge:
    external: true
